apiVersion: v1
kind: Secret
metadata:
  name: bbb-server
type: Opaque
stringData:
  BBB_SERVER_TOKEN: replace-with-a-random-token
  # Add the storage credentials needed by both the leader and workers here.
  # BBB_AZBLOB_ACCOUNTKEY: replace-me
  # AWS_ACCESS_KEY_ID: replace-me
  # AWS_SECRET_ACCESS_KEY: replace-me
---
apiVersion: v1
kind: Service
metadata:
  name: bbb-leader
spec:
  selector:
    app.kubernetes.io/name: bbb
    app.kubernetes.io/component: leader
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bbb-leader-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bbb-leader
spec:
  serviceName: bbb-leader
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bbb
      app.kubernetes.io/component: leader
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bbb
        app.kubernetes.io/component: leader
    spec:
      containers:
        - name: bbb
          image: ghcr.io/tg123/bbb:latest
          imagePullPolicy: IfNotPresent
          args:
            - server
            - --listen=0.0.0.0:8080
            - --db=/var/lib/bbb/server.db
            - --workers=0
            - --token=$(BBB_SERVER_TOKEN)
          envFrom:
            - secretRef:
                name: bbb-server
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          volumeMounts:
            - name: data
              mountPath: /var/lib/bbb
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bbb-leader-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bbb-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bbb
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bbb
        app.kubernetes.io/component: worker
    spec:
      containers:
        - name: bbb
          image: ghcr.io/tg123/bbb:latest
          imagePullPolicy: IfNotPresent
          args:
            - server
            - --leader=http://bbb-leader:8080
            - --workers=1
            - --token=$(BBB_SERVER_TOKEN)
          envFrom:
            - secretRef:
                name: bbb-server
